<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Velora</title>
<style>
:root{--bg:#efe8dc;--fg:#1e1b16;--muted:#6b645a;--accent:#355e57;--paper:#f6f1e8;--surface:#e7dfd1;--bt:#3f6a62;--bb:#2c514b;--line:rgba(30,27,22,.12)}
[data-theme=dark]{--bg:#14120f;--fg:#efe8dc;--muted:#b7b0a4;--accent:#8aa9a3;--paper:#1c1915;--surface:#241f1a;--bt:#4a7a70;--bb:#355e57;--line:rgba(239,232,220,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;letter-spacing:-.02em;margin:0 0 8px}
header{position:sticky;top:8px;z-index:20;margin:8px;padding:10px 14px;border-radius:20px;background:var(--paper);display:flex;gap:10px;align-items:center;box-shadow:0 2px 12px rgba(30,27,22,.08)}
header strong{font-size:1.05rem}nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
nav button,.btn{min-height:40px;border:0;border-radius:12px;padding:0 12px;background:linear-gradient(var(--bt),var(--bb));color:#f4efe6;font-size:14px;font-weight:600;cursor:pointer}
nav button.ghost,.ghost{background:transparent;color:var(--fg);font-weight:500}
nav button.on{outline:2px solid var(--accent)}
main{padding:12px 16px 56px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border-radius:20px;padding:14px;margin:10px 0;box-shadow:4px 4px 12px rgba(30,27,22,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
textarea,input,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--fg);font:inherit}
textarea{min-height:110px;resize:vertical}
svg{width:100%;height:auto;display:block;border-radius:14px;background:var(--paper)}
.chip{min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--paper);color:var(--fg);font-size:14px;cursor:pointer}
.chip.on{outline:2px solid var(--accent);background:var(--surface)}
p{margin:8px 0;color:var(--muted)}label{display:block;font-weight:600;margin:8px 0 6px;color:var(--fg);font-size:14px}
.muted{color:var(--muted);font-size:.92rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
pre{background:var(--paper);border-radius:12px;padding:12px;overflow:auto;font-size:12px;line-height:1.4;max-height:220px;border:1px solid var(--line)}
.ok{color:#2c6e49}.warn{color:#8a3b24}.hidden{display:none}
.status{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--paper);margin:8px 0}
.project{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.project strong{color:var(--fg)}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.stage{position:relative;touch-action:none}
.stage .art svg{background:var(--paper)}
.stage .overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent}
.stage .overlay rect{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:8 6}
.stage .overlay line{stroke:var(--accent);stroke-width:1.5}
.stage .overlay circle.anchor{fill:var(--paper);stroke:var(--accent);stroke-width:2}
.stage .overlay circle.handle{fill:var(--accent)}
.ghost.on{outline:2px solid var(--accent)}
.project.on{outline:2px solid var(--accent);border-radius:12px}
.ink{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-transform:capitalize}
.ink input{width:44px;min-height:36px;padding:2px}
.layer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.layer input[type=text]{flex:1;min-width:120px;min-height:36px}
.layer input[type=number]{width:72px;min-height:36px}
.layer.on{outline:2px solid var(--accent);border-radius:12px;padding:8px}
</style>
</head>
<body>
<header>
<svg width="28" height="28" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#1e1b16"/><polygon points="2,3 7,3 8,13 4,13" fill="#efe8dc"/><polygon points="9,3 14,3 12,13 8,13" fill="#355e57"/></svg>
<strong>Velora</strong>
<nav id="nav">
<button type="button" class="ghost on" data-route="studio">Studio</button>
<button type="button" class="ghost" data-route="compose">New</button>
<button type="button" class="ghost" data-route="providers">Providers</button>
<button type="button" class="ghost" data-route="settings">Settings</button>
</nav>
</header>
<main id="app"></main>
<script src="js/vxl.js"></script>
<script src="js/projects.js"></script>
<script src="js/skills.js"></script>
<script src="js/needle.js"></script>
<script src="js/planner.js"></script>
<script src="js/attach.js"></script>
<script src="js/trace.js"></script>
<script src="js/boolean.js"></script>
<script src="js/offset.js"></script>
<script src="js/align.js"></script>
<script src="js/gradient.js"></script>
<script src="js/clip.js"></script>
<script src="js/scissors.js"></script>
<script src="js/shape.js"></script>
<script src="js/knife.js"></script>
<script src="js/reflect.js"></script>
<script src="js/join.js"></script>
<script src="js/shear.js"></script>
<script src="js/outline.js"></script>
<script src="js/anchors.js"></script>
<script src="js/corners.js"></script>
<script src="js/divide.js"></script>
<script src="js/zigzag.js"></script>
<script src="js/roughen.js"></script>
<script src="js/blend.js"></script>
<script src="js/pencil.js"></script>
<script src="js/curve.js"></script>
<script src="js/typepath.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
