name: Restore trace.js
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore trace.js from known good commit
        run: |
          git config user.email "adnanrazaar786@gmail.com"
          git config user.name "Coding with AdnanRaza"
          git show 22d361983a60cea0df7baa2807cb837c946345f3:app/src/main/assets/www/js/trace.js > app/src/main/assets/www/js/trace.js
          wc -c app/src/main/assets/www/js/trace.js
          head -c 60 app/src/main/assets/www/js/trace.js
          git add app/src/main/assets/www/js/trace.js
          git commit -m "Restore trace.js from 22d3619 after placeholder accident" || exit 0
          git push origin HEAD:main
