name: restore-trace
on:
  push:
    paths:
      - .github/workflows/restore-trace.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore tracer and arch cap
        run: |
          git checkout 7974bd44baf7b9a1dc343bc0e702c4865cb9e4f3 -- app/src/main/assets/www/js/trace.js
          python3 - << 'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/www/js/trace.js")
          text = p.read_text()
          old = "      if (onFlat < 2 || onArc < 4 || onSide < 1) continue;\n      if (worst > Math.max(1.85, r * 0.09)) continue;"
          new = "      if (onFlat < 2 || onArc < 4) continue;\n      if (onSide < 1 && reach < r * 1.2) continue;\n      if (worst > Math.max(1.85, r * 0.09)) continue;"
          if old not in text:
              raise SystemExit("anchor missing")
          p.write_text(text.replace(old, new, 1))
          phase = Path("docs/plan/VELORA_PHASES.md")
          ptext = phase.read_text()
          line = "- [x] Trace rounded triangle: a short shoulder fillet emits a cubic instead of a miter, so a 10px corner radius keeps the tip round; a sharp triangle, circle, pentagon, and map pin stay\n"
          add = line + "- [x] Trace arch cap: a rectangle with a semicircular end still emits two kappa quarters and three lines when the side runs simplify away, so a doorway stays a true arch; a circle, semicircle, stadium, rounded rectangle, and D-cap stay\n"
          if "Trace arch cap:" not in ptext and line in ptext:
              phase.write_text(ptext.replace(line, add, 1))
          check = Path("tools/trace-check.js")
          ctext = check.read_text()
          if "function arch(" not in ctext:
              insert = """
          function arch(x, y, cx, cy, r, body, cap) {
            if (cap === \"top\") {
              if (x >= cx - r && x <= cx + r && y >= cy && y <= cy + body) return true;
              const dx = x - cx;
              const dy = y - cy;
              return dx * dx + dy * dy <= r * r && y <= cy;
            }
            if (y >= cy - r && y <= cy + r && x >= cx - body && x <= cx) return true;
            const dx = x - cx;
            const dy = y - cy;
            return dx * dx + dy * dy <= r * r && x >= cx;
          }
          const archTop = trace(raster(160, 180, (x, y) => arch(x, y, 80, 70, 40, 80, \"top\")), 160, 180);
          const archTopN = counts(archTop);
          assert.strictEqual(archTopN.c, 2, \"arch top cubics \" + archTop);
          assert.strictEqual(archTopN.l, 3, \"arch top lines \" + archTop);
          const archRight = trace(raster(180, 160, (x, y) => arch(x, y, 70, 80, 36, 70, \"right\")), 180, 160);
          const archRightN = counts(archRight);
          assert.strictEqual(archRightN.c, 2, \"arch right cubics \" + archRight);
          assert.strictEqual(archRightN.l, 3, \"arch right lines \" + archRight);
          const archTall = trace(raster(140, 200, (x, y) => arch(x, y, 70, 50, 32, 120, \"top\")), 140, 200);
          const archTallN = counts(archTall);
          assert.strictEqual(archTallN.c, 2, \"arch tall cubics \" + archTall);
          assert.strictEqual(archTallN.l, 3, \"arch tall lines \" + archTall);

          """
              needle = 'console.log("trace-check ok"'
              if needle not in ctext:
                  raise SystemExit("check anchor missing")
              check.write_text(ctext.replace(needle, insert + needle, 1))
          Path(".github/workflows/restore-trace.yml").unlink()
          PY
          git config user.name "AdnanRaza88"
          git config user.email "AdnanRaza88@users.noreply.github.com"
          git add -A
          git commit -m "Keep a doorway arch as a kappa cap."
          git push
