        if (segs[i].k !== "L" || !segs[i].pts) continue;
        var from = starts[i];
        var to = segEnd(segs[i]);
        var chord = Math.hypot(to[0] - from[0], to[1] - from[1]);
        if (chord < 6 || chord > 32) continue;
        if (chordBow(segs[i].pts) > 1.6) continue;
        if (spanTurn(segs[i].pts) > 0.55) continue;
        var prev = (i + n - 1) % n;
